name: dsh-plugin npm

# v1.1 (D-264, D-265). Packs rlmh (dsh-plugin/) from the dispatched commit, tests the packed file the way a user
# gets it (installed into a throwaway dsh profile by the cache guard), and publishes it to npm only when asked.
# Publishing runs only from branch dsh-plugin, in the `npm` environment, whose required reviewer approves each run,
# with npm trusted publishing (no token). npm checks the calling workflow's file name, so this file must be registered
# as rlmh's trusted publisher on npmjs.com (workflow dsh-plugin-npm.yml, environment npm). npm sets that up per
# package and only once the package exists, so the first version goes up by hand (documentation/v1.1/release.md).
# Run: gh workflow run dsh-plugin-npm.yml --ref dsh-plugin [-f publish=true]
# A push to dsh-plugin that changes the package or this file runs the pack job only. That also registers the workflow,
# which GitHub needs before it can be dispatched from a branch other than the default one.

on:
  push:
    branches: [dsh-plugin]
    paths:
      - dsh-plugin/package.json
      - .github/workflows/dsh-plugin-npm.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (the npm environment's reviewer still approves)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the plugin's dev dependencies
        working-directory: dsh-plugin
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Node tests
        working-directory: dsh-plugin
        run: node --test 'test/*.test.mjs'
      - name: Python tests
        run: uv run --locked --project engine python -m unittest discover -s dsh-plugin/test -p 'test_*.py' -v
      - name: Pack
        working-directory: dsh-plugin
        run: |
          mkdir -p ../out
          npm pack --pack-destination ../out
          set -- ../out/*.tgz
          test "$#" = 1
          tar -tzf "$1" | sort
      - name: Install DeepSeek Harness (pinned)
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1 pnpm@11.28.5 --no-audit --no-fund # zizmor: ignore[adhoc-packages] exact versions, for the install check
      - name: Install the packed file into a clean profile and run the cache guard
        working-directory: dsh-plugin
        run: |
          set -- ../out/*.tgz
          DSH_CLI=dsh RLMH_DSH_PLUGIN="$(cd ../out && pwd)/$(basename "$1")" node test/e2e/cache-guard.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rlmh-tarball
          path: out/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/dsh-plugin'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rlmh-tarball
          path: out
      # trusted publishing needs Node 22.14 or later and npm 11.5.1 or later
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g npm@11.7.0 # zizmor: ignore[adhoc-packages] an exact version, for trusted publishing
      - name: Publish
        # a version already on npm is skipped, so a re-run is harmless
        run: |
          set -- out/*.tgz
          test "$#" = 1
          read -r name version < <(tar -xzOf "$1" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.name, p.version)')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          npm publish "./$1" --access public --provenance --tag "$dist_tag" # ./ so npm reads a file (D-167)
