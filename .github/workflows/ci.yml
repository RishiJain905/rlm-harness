name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            suffix: ""
          - os: macos-latest
            target: darwin-arm64
            suffix: ""
          - os: windows-latest
            target: windows-x64
            suffix: .exe
    defaults:
      run:
        shell: bash
    env:
      BIN: dist/rlmh-${{ matrix.target }}${{ matrix.suffix }}
    steps:
      # Every OS checks out the same LF bytes, so hashes and profiles agree (D-43).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Engine tests
        run: uv run --locked --project engine pytest engine/tests
      - name: Audit the workflows
        # zizmor, pinned in engine's dev group, as the verify gate's workflows stage runs it
        if: runner.os == 'Linux'
        run: uv run --locked --project engine zizmor --offline --no-progress .github/
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Typecheck
        # before the engine is embedded: a fresh checkout must typecheck without build/engine-files.ts
        working-directory: app
        run: bun run typecheck
      - name: Embed the engine
        working-directory: app
        run: bun run scripts/embed-engine.ts
      - name: Warm uv's cache for the fixture venvs
        # The eval tests build the fixture's venvs with UV_OFFLINE=1 (v1 step 2). uv sync installs from the lockfile's
        # URLs and caches no index entry, so an unpinned "pytest" can't resolve offline until one online install.
        run: |
          uv venv "$RUNNER_TEMP/fx-warm" --python 3.12
          uv pip install --python "$RUNNER_TEMP/fx-warm" pytest
      # v1 step 2: the web fixture's grading tests need Node, the pinned pnpm, a filled pnpm store and a
      # Playwright Chromium. Linux only; elsewhere those tests skip and say why (the folders stay empty).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os == 'Linux'
        with:
          version: 10.34.7
      - name: Prepare the web fixture
        if: runner.os == 'Linux'
        env:
          RLMH_TEST_PNPM_STORE: ${{ runner.temp }}/pnpm-store
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: bash app/test/eval/prepare-web.sh
      - name: App tests
        working-directory: app
        env:
          RLMH_TEST_PNPM_STORE: ${{ runner.temp }}/pnpm-store
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: bun test
      - name: Compile rlmh
        working-directory: app
        # The two autoload flags stop the binary loading a .env or bunfig.toml from the folder it runs
        # in (D-44); --reject-unresolved fails the build if build/engine-files.ts is missing (step 10).
        # On Windows, bun build does not create a missing output folder.
        run: |
          mkdir -p ../dist
          bun build --compile --reject-unresolved --no-compile-autoload-dotenv --no-compile-autoload-bunfig src/main.ts --outfile "../$BIN"
      - name: The binary carries the engine
        # --reject-unresolved does not catch a missing literal import() in Bun 1.4.4, so check the bytes
        run: |
          bundle=$(sed -n 's/^export const ENGINE_BUNDLE_SHA256 = "\(.*\)";$/\1/p' app/build/engine-files.ts)
          test -n "$bundle"
          grep -q "$bundle" "$BIN"

      - name: Smoke --version
        run: |
          out="$("$BIN" --version)"
          echo "$out"
          test "$out" = "rlmh 0.2.0"
      - name: Smoke info
        env:
          RLMH_ENGINE: uv run --project engine python -X utf8 -m rlm_engine serve
        run: |
          info="$("$BIN" info)"
          echo "$info"
          echo "$info" | bun -e 'const j = JSON.parse(await Bun.stdin.text()); if (j.engine.protocol !== 1 || j.app.version !== j.engine.version) { console.error("info mismatch"); process.exit(1); } console.log("info ok");'
      - name: Smoke info without RLMH_ENGINE
        # The binary must not mistake this checkout for a source run.
        run: |
          set +e
          msg="$("$BIN" info 2>&1)"
          code=$?
          set -e
          echo "$msg"
          test "$code" = 1
          echo "$msg" | grep -q RLMH_ENGINE
      - name: Smoke rlmh without a terminal
        run: |
          set +e
          "$BIN" < /dev/null
          code=$?
          set -e
          test "$code" = 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rlmh-${{ matrix.target }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  # Step 10: the one-line install on clean runners, from a local server holding this build's binary.
  # The only job that touches the network on purpose (uv downloads Python 3.12); it uses no key.
  install:
    name: install ${{ matrix.leg }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            leg: linux-x64
            target: linux-x64
            uv: "0"
          - os: ubuntu-latest
            leg: linux-x64 (uv on PATH)
            target: linux-x64
            uv: "1"
          - os: macos-15
            leg: darwin-arm64
            target: darwin-arm64
            uv: "0"
          - os: windows-latest
            leg: windows-x64
            target: windows-x64
            uv: "0"
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rlmh-${{ matrix.target }}
          path: served
      - if: matrix.uv == '1'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lint install.sh
        if: matrix.os == 'ubuntu-latest' && matrix.uv == '0'
        run: |
          shellcheck install.sh
          ! grep -q $'\r' install.sh
      - name: Parse install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
      - name: Install, set up and run
        env:
          UV_PRESENT: ${{ matrix.uv }}
        run: |
          cp install.sh install.ps1 served/
          # macOS runners have shasum, not sha256sum; both print "<hex>  <name>"
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          (cd served && "${sum[@]}" rlmh-* install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS)
          bash scripts/install-check.sh served

  # D-130: the npm packages, packed from this build's binary and installed from a local registry with
  # npm, `bun add -g --trust` and a plain `bun add -g`, then first run with the bundled uv and a
  # fake-provider question. Touches the network for uv's archive, Verdaccio and Python 3.12; no key.
  npm:
    name: npm ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rlmh-${{ matrix.target }}
          path: assets
      - name: Pack, install and run
        run: |
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          (cd assets && "${sum[@]}" rlmh-* > SHA256SUMS && cat SHA256SUMS)
          version=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' app/src/version.ts)
          bash scripts/npm-pack.sh assets "$version" out
          bash scripts/npm-check.sh out assets
