[project]
name = "rlm-engine"
version = "0.1.1"
description = "The rlm-harness engine: the agent loop, the trained contract and the REPL, behind a JSON-RPC link"
requires-python = "==3.12.*"
dependencies = []
license = "MIT"

[dependency-groups]
# zizmor audits .github/ in the verify gate and CI; pinned here so it runs offline from uv.lock
dev = ["pytest>=8", "zizmor==1.31.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
