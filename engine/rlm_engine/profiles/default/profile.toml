contract = "v4"
guidance = "guidance.md"
cache_api = true              # cache-shaped sub-calls: segments(), llm(..., over=), llm_batch(..., shared=, over=) (D-119)
agent_api = true              # ask_files, schema=, llm_async, rlm, review, check, outline (D-157 to D-162)

[root]
temperature = 1.0
[sub]
temperature = 0.3

[rlm]                         # rlm() child runs (D-160)
max_runs = 12                 # children per run, at any depth
max_turns = 30                # each child's turn limit; rlm(max_turns=) can only lower it
max_depth = 1                 # the root's children cannot start children of their own
max_parallel = 4              # children running at once; the rest wait

[compaction]              # default profile
window = 262144           # W': compact as if the model's window were at most this many tokens
keep_ratio = 0.16         # DeepSeek Harness: keep the newest 16% of (W' - out) verbatim
reserve = 65536           # DeepSeek Harness's margin
summary_max_tokens = 8192

[read]                        # contract.READ_LIMITS_V4 with more turns and output tokens (D-152)
max_turns = 50
max_subcalls = 80
root_max_tokens = 16384
output_max_chars = 8000
cell_timeout_s = 120
subcall_max_chars = 60000
subcall_max_tokens = 16384
subcall_oversize = "error"

[repo]                        # contract.EDIT_LIMITS_V4 with more turns and output tokens (D-152)
max_turns = 150
max_subcalls = 80
root_max_tokens = 16384
output_max_chars = 8000
cell_timeout_s = 300
subcall_max_chars = 60000
subcall_max_tokens = 16384
subcall_thinking = "low"
subcall_oversize = "error"
pace_nudge = true             # training's prod-v2 runs and evaluations used the pacing line
