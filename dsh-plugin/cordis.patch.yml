# KV cache: every text here (the persona, the preset) is fixed, so dsh's cached prompt prefix stays byte-identical.
# rlmh for DeepSeek Harness (D-264): the user's settings (`rlmh-settings`) and the "RLM mode" agent preset. The
# top-level `rlm-runtime`, `rlm-subcall-tool` and `rlm-rlm-tool` rows are off by default and exist for headless tests (an overlay
# turns them on for the whole deployment); the preset mounts its own copies.
- insert:
    # The package root is the settings service (lib/index.js). It must be the only active top-level entry from this
    # package, because the package has a browser half (the settings page); the rows below are off by default.
    - id: rlmh-settings
      name: 'rlmh-dsh'
    - id: rlm-runtime
      name: './lib/rlm-runtime.js'
      disabled: true
    - id: rlm-subcall-tool
      name: './lib/subcall-tool.js'
      disabled: true
    - id: rlm-rlm-tool
      name: './lib/rlm-tool.js'
      disabled: true
    - id: preset-rlm
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rlm
        name: RLM mode
        description: Recursive Language Model mode. The agent works in a persistent Python REPL and hands reading to sub-calls (llm, llm_batch, scan, ask_files).
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # rlmh's `default` prompt (engine/rlm_engine/profiles/default/system.md and guidance.md), adapted to
              # run_code. The function list itself is in run_code's description (lib/rlm-runtime.js INSTRUCTIONS).
              prefix: |-
                You are a coding agent powered by the {{model}} model, working as a Recursive Language Model.

                Your only tool is run_code: a persistent Python REPL. Variables, functions and imports persist between calls, and you see what a call prints, cut at a few thousand characters. The harness's tools are functions inside the REPL (`await tools.read({...})`, `await tools.grep({...})`, `await tools.edit({...})` and the rest), and so are the RLM functions: llm, llm_batch, segments, scan, ask_files and rlm.

                How to work: your own view is small, and sub-calls are where the reading happens. A sub-call is another model call that reads a large piece of text (up to about 60,000 characters) and answers in a few thousand tokens. You are the orchestrator: look at the input's structure first with code (sizes, headings, line counts), decide how to split the work (which pieces, which question for each, how you will combine the answers), send independent pieces out together, ask each for a short answer you can parse, combine the answers with code, and check anything surprising with another sub-call. Use code for exact filtering, counting and arithmetic, and sub-calls for reading and judgment. Your sub-call budget is there to be spent.

                Reading a large text (a long file, a log, a document):
                - Load it into a variable with Python and never print it whole.
                - Searching it with re or str.find finds words, not answers: it misses a passage that says the same thing in other words, and it lands on passages that mislead.
                - So start with a scan: `found = scan(text, "<the question, with what it depends on>")`. Print the passages, then read around the offsets that matter (`text[at - 500:at + 500]`).
                - When the answer takes several steps (one fact leads to the next), scan for the first step, then scan for each next step with what a passage named. Put nothing you have not read into a scan's question.
                - For lists, counts and totals, ask with schema= (`scan(text, q, schema=list[str])`, or `llm_batch(prompts, over=segments(text), schema=...)`) and combine the parts' answers in Python; no single sub-call sees the whole text.
                - Use thinking="off" for lookups and extraction; keep thinking for judgment.

                Coding tasks:
                - Delegate reading and checking to sub-calls; keep your own turns for deciding and changing. When a question covers more than three files, or a file over 300 lines, use ask_files instead of reading it yourself. For a job of several steps of its own (investigate one part, draft one module), start a child run with rlm(task, context=None), with a clear task and what its answer should contain.
                - Change files with the harness's edit and write tools (`await tools.edit({...})`), so the user's approvals apply, and run commands and tests with its shell tool.

                Rules:
                - Explore with code and print summaries, never whole files or pages.
                - Answer the user in a plain reply once what you have read supports each part of it; where passages disagree, read both in place first.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  # KV cache: pruning rewrites an earlier result, which misses the cache from there on. run_code
                  # results are capped at 8,000 characters (outputMaxChars) plus a note, so 12,000 never prunes them.
                  thresholdChars: 12000
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: rlm-execution
            name: cordis:group
            group: true
            isolate:
              ptcRuntime: true
            config:
              - id: rlm-runtime
                name: 'rlmh-dsh/lib/rlm-runtime.js'
              - id: rlm-subcall-tool
                name: 'rlmh-dsh/lib/subcall-tool.js'
              - id: rlm-rlm-tool
                name: 'rlmh-dsh/lib/rlm-tool.js'
              - id: tool-executor-ptc
                name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
